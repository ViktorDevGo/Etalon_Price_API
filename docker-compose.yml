# Минимальный docker-compose для Timeweb Cloud
# Деплоит только основной API сервер
# Остальные сервисы деплоятся отдельно через Dockerfile

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ./api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - HTTP_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_DSN=${DATABASE_DSN}
      - FOURTOCHKI_WSDL_URL=${FOURTOCHKI_WSDL_URL}
      - FOURTOCHKI_BASE_URL=${FOURTOCHKI_BASE_URL}
      - FOURTOCHKI_LOGIN=${FOURTOCHKI_LOGIN}
      - FOURTOCHKI_PASSWORD=${FOURTOCHKI_PASSWORD}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_NOTIFICATION_TO=${EMAIL_NOTIFICATION_TO}
      - TZ=Europe/Moscow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
